name: Publicar en GitHub Pages

# Arma el sitio: el prototipo y la app real (en /app/).
# Requiere: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compilar la app
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /tarjetasFidelizacion/app
        run: |
          npm ci
          npm run build
      - name: Armar el sitio
        run: |
          mkdir _site
          cp index.html _site/
          cp -r prototipo _site/
          cp -r web/out _site/app
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
