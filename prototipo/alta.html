<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sumate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="estilos.css">
</head><body><main class="screen">
<div class="proto"><span>Prototipo · pantalla 1 de 4</span><a href="./">Todas las pantallas</a></div>
<div class="biz"><div class="logo" id="logo"></div><div><strong id="nom"></strong><p class="muted small">Tarjeta de cliente frecuente</p></div></div>
<h1 id="titulo"></h1>
<p class="muted">Registrate en 30 segundos. Tu tarjeta queda en el celular, sin descargar ninguna app.</p>
<form class="box" id="f">
  <label>Nombre<input id="nombre" autocomplete="given-name" placeholder="Lucía" required></label>
  <label>WhatsApp o mail<input id="contacto" autocomplete="tel" placeholder="11 5555-1234" required></label>
  <label>Cumpleaños (opcional)<input id="cumple" type="date"></label>
  <label class="check"><input type="checkbox" id="ok" required><span>Acepto la <u>política de privacidad</u>. Mis datos solo los ve <span id="nom2"></span>.</span></label>
  <button class="btn" type="submit">Crear mi tarjeta</button>
</form>
<p class="muted small" style="text-align:center">Funciona con Habitué</p>
</main>
<script src="datos.js"></script>
<script>
const N=H.actual(); H.aplicarMarca(N);
const $=id=>document.getElementById(id), p0=H.premios(N)[0];
document.title="Sumate a "+N.nombre;
$("logo").textContent=H.iniciales(N.nombre); $("nom").textContent=N.nombre; $("nom2").textContent=N.nombre;
$("titulo").textContent=p0?`A las ${p0.visitas} visitas, ${p0.nombre.charAt(0).toLowerCase()+p0.nombre.slice(1)} de regalo`:"Sumá visitas y ganá premios";
$("f").addEventListener("submit",e=>{e.preventDefault();location.href="tarjeta.html?nueva=1&n="+encodeURIComponent(N.id)+"&nombre="+encodeURIComponent($("nombre").value.trim())})</script>
</body></html>
